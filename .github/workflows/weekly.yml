# Every Tuesday: fetch this week's Continente, Pingo Doce and Lidl prices for everyone's lists, write the recommendation,
# commit the price files and report (the price history), and post the report as a GitHub issue.
# Also runs on demand: Actions tab -> "Weekly prices" -> "Run workflow".
name: Weekly prices

on:
  schedule:
    - cron: "23 7 * * 2"        # Tuesday 07:23 UTC (07:23 in Lisbon in winter, 08:23 in summer)
  workflow_dispatch:
    inputs:
      trip_cost:
        description: "Trip cost for a second store, in euros"
        default: "3"

concurrency: weekly               # never two runs at once

permissions:
  contents: write                # commit the price files and report
  issues: write                  # post the report

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 45            # ~25 min on a first Tuesday (re-checks unavailable products)
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Everyone's lists (data/users/, written by the app) decide what gets priced. Order: catalogues and
      # lidl.pt first (they are the candidates), then the model judges every new candidate for each person's
      # rule, then the two online shops are priced for the products that count for someone.
      # A blocked or broken store must not stop the others: each step may fail, and the report says which did.
      - name: Catalogues
        id: catalogues
        continue-on-error: true
        run: |
          python src/catalogue.py continente build
          python src/catalogue.py pingodoce build

      - name: Lidl prices
        id: lidl
        continue-on-error: true
        run: python src/fetch_lidl_online.py

      - name: Products for everyone's lists (model judges new candidates)
        id: llm
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/lists.py build

      - name: Continente prices
        id: continente
        continue-on-error: true
        run: |
          # first Tuesday of the month: also re-check products that were unavailable
          if [ "$(date +%d)" -le 7 ]; then python src/fetch_continente_online.py --recheck
          else python src/fetch_continente_online.py; fi

      - name: Pingo Doce prices
        id: pingodoce
        continue-on-error: true
        run: |
          if [ "$(date +%d)" -le 7 ]; then python src/fetch_pingodoce_online.py --recheck
          else python src/fetch_pingodoce_online.py; fi

      - name: Recommendation
        run: |
          # the issue is the owner's list (repository variable OWNER, else the first person in data/users)
          OWNER="${{ vars.OWNER }}"; OWNER="${OWNER:-$(ls data/users | head -1)}"
          python src/recommend.py --user "$OWNER" --trip-cost "${{ inputs.trip_cost || '3' }}"
          REPORT="data/reports/$(date +%F).md"
          {
            echo
            echo "---"
            echo "Run: Continente fetch ${{ steps.continente.outcome }}, Pingo Doce fetch ${{ steps.pingodoce.outcome }}, Lidl fetch ${{ steps.lidl.outcome }}, catalogues ${{ steps.catalogues.outcome }}, product lists and model ${{ steps.llm.outcome }}. Other people's reports: in the app."
            echo "If a fetch failed, its prices above are from an earlier week. Log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$REPORT"
          echo "REPORT=$REPORT" >> "$GITHUB_ENV"

      - name: Commit prices and report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          # the price runs also mark products that are no longer sold online as "unavailable"
          git add data/prices data/reports data/shopping data/llm data/catalogue
          git diff --cached --quiet || git commit -m "Weekly prices and recommendation $(date +%F)"
          # The run takes ~20 minutes; if I pushed meanwhile, put this commit on top of mine and retry.
          # (2026-11-03: the first run's push was rejected for exactly this reason.)
          for attempt in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            echo "push failed (attempt $attempt), retrying"; sleep 10
          done
          exit 1

      - name: Post the report as an issue
        if: always() && env.REPORT != ''       # also when the commit failed: the report is still worth having
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --title "Where to shop, $(date +%F)" --body-file "$REPORT"
